name: Android CI 🚀 Unified Build Pipeline
run-name: 🔄 Android ${{ vars.RN_BUILD_TYPE }} Build • Commit ${{ github.sha }}

on:
  push:
    branches: [ stage ]
    paths:
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/android/**'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/src/**'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/package.json'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/package-lock.json'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/app.json'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/index.js'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    name: Android Build (${{ vars.RN_BUILD_TYPE }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nv_react_native_sdk_app

    env:
      BUILD_TYPE: ${{ vars.RN_BUILD_TYPE }}
      NV_BRAND_ID: ${{ vars.NV_BRAND_ID }}
      NV_BRAND_ENCRYPTION_KEY: ${{ vars.NV_BRAND_ENCRYPTION_KEY }}

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          

      - name: 📥 Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: 📦 Bundle React Native JS
        run: |
          mkdir -p android/app/src/main/assets

          npx react-native bundle \
            --platform android \
            --dev false \
            --reset-cache \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: 🧹 Remove Source Map
        run: rm -f android/app/src/main/assets/index.android.bundle.map || true

      - name: 🔐 Decode Keystore (Release Only)
        if: env.BUILD_TYPE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.RN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          ls -lh android/app/release-key.jks

      - name: 🏗 Build Android App
        working-directory: react_native_notifyvisitors/nv_react_native_sdk_app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew clean assembleDebug --no-daemon --parallel
          else
            ./gradlew clean bundleRelease --no-daemon --parallel
          fi

      - name: 📁 Show Build Outputs
        run: |
          ls -lh android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/ || true
          ls -lh android/app/build/outputs/bundle/release/ || true

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_TYPE }}
          path: |
            react_native_notifyvisitors/nv_react_native_sdk_app/android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
            react_native_notifyvisitors/nv_react_native_sdk_app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: ☁️ Upload APK to S3 (Release Only)
        if: success() && env.BUILD_TYPE == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          APK_PATH: react_native_notifyvisitors/nv_react_native_sdk_app/android/app/build/outputs/apk/release/*.apk
          S3_DESTINATION: ${{ github.event.repository.name }}/release-${{ github.run_number }}.apk
        run: |
          for file in $APK_PATH; do
            aws s3 cp "$file" "s3://$S3_BUCKET/$S3_DESTINATION"
          done

      - name: 🧹 Cleanup Keystore
        if: env.BUILD_TYPE == 'release'
        run: rm -f android/app/release-key.jks
