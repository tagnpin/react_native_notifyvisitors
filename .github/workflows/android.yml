name: Android CI – App Build & Signing
run-name: Android ${{ vars.RN_BUILD_TYPE }} build (commit ${{ github.sha }})

on:
  push:
    branches: [ stage ]
    paths:
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/android/**'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/src/**'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/package.json'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/package-lock.json'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/app.json'
      - 'react_native_notifyvisitors/nv_react_native_sdk_app/index.js'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    name: Android Build (${{ vars.RN_BUILD_TYPE }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nv_react_native_sdk_app

    env:
      # Build type
      BUILD_TYPE: ${{ vars.RN_BUILD_TYPE }}

      # Base64 configs
      FIREBASE_JSON_BASE64: ${{ secrets.RN_FIREBASE_JSON_BASE64 }}
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES_B64 }}
      KEYSTORE_FILE_BASE64: ${{ secrets.RN_ANDROID_KEYSTORE_BASE64 }}

      # Brand / app config
      NV_BRAND_ID: ${{ vars.NV_BRAND_ID }}
      NV_BRAND_ENCRYPTION_KEY: ${{ vars.NV_BRAND_ENCRYPTION_KEY }}

      # Android signing secrets
      KEYSTORE_PASSWORD: ${{ secrets.RN_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RN_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NV_KEY_PASSWORD }}

      # S3 secrets
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      S3_DESTINATION: ${{ github.event.repository.name }}/${{ vars.RN_BUILD_TYPE }}-${{ github.run_number }}.apk

    steps:
      # -----------------------------
      # Checkout source code
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Validate required env vars
      # -----------------------------
      - name: Validate Android CI environment variables
        run: |
          set -e

          : "${FIREBASE_JSON_BASE64:?Missing FIREBASE_JSON_BASE64}"
          : "${LOCAL_PROPERTIES:?Missing LOCAL_PROPERTIES}"
          : "${KEYSTORE_FILE_BASE64:?Missing KEYSTORE_FILE_BASE64}"

          : "${NV_BRAND_ID:?Missing NV_BRAND_ID}"
          : "${NV_BRAND_ENCRYPTION_KEY:?Missing NV_BRAND_ENCRYPTION_KEY}"

          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"

          echo "✅ All required environment variables are present"

      # ------------------------------------------------------------
      # Read plugin version from root package.json
      # NOTE:
      # - Global working-directory = nv_react_native_sdk_app
      # - Plugin package.json lives one level up (../package.json)
      # - Version is exported to GITHUB_ENV for later steps
      # ------------------------------------------------------------
      - name: 📦 Extract Plugin Version
        id: extract_plugin_version
        run: |
          set -e

          # Read version from plugin root package.json
          NV_PLUGIN_VERSION=$(node -p "require('../package.json').version")

          # Export version as environment variable for subsequent steps
          echo "PLUGIN_VERSION=$NV_PLUGIN_VERSION" >> $GITHUB_ENV

          # Log for visibility (safe, version is not secret)
          echo "Plugin version detected: $NV_PLUGIN_VERSION"


      # -----------------------------
      # Node.js setup
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nv_react_native_sdk_app/package-lock.json

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # -----------------------------
      # Java & Android SDK
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: ${{ runner.os }}-ndk-27.1.12297006

      # -----------------------------
      # Prepare Firebase & signing
      # -----------------------------
      - name: Prepare Firebase config & Android signing files
        run: |
          set -e

          # Firebase config
          mkdir -p android/app
          echo "$FIREBASE_JSON_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 android/app/google-services.json

          # Decode local.properties template
          echo "$LOCAL_PROPERTIES" | base64 --decode > android/local.properties.template

          # Inject env vars into template
          envsubst < android/local.properties.template > android/local.properties
          rm -f android/local.properties.template
          chmod 600 android/local.properties

          # Mask values in logs
          sed 's/=.*/=****/g' android/local.properties

          mkdir -p android/keystore
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > android/keystore/nv_react_native_sdk_app_release.keystore
          chmod 600 android/keystore/nv_react_native_sdk_app_release.keystore
          ls -lh android/keystore/
      # -----------------------------
      # React Native bundle
      # -----------------------------
      - name: Bundle React Native JS
        run: |
          mkdir -p android/app/src/main/assets

          npx react-native bundle \
            --platform android \
            --dev false \
            --reset-cache \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Remove source map
        run: rm -f android/app/src/main/assets/index.android.bundle.map || true

      # -----------------------------
      # Build Android app
      # -----------------------------
      - name: Build Android app
        working-directory: nv_react_native_sdk_app/android
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew clean assembleDebug --no-daemon --parallel
          else
            ./gradlew clean assembleRelease --no-daemon --parallel
          fi

      # -----------------------------
      # Upload build artifacts
      # -----------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_TYPE }}-v${{ env.NV_PLUGIN_VERSION }}
          path: |
            nv_react_native_sdk_app/android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: ignore

      # -----------------------------
      # Upload release APK to S3
      # -----------------------------
      - name: Upload APK to S3 (release only)
        if: env.BUILD_TYPE == 'release'
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "❌ No APK found to upload"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Uploading $(basename "$apk")"
            aws s3 cp "$apk" "s3://$S3_BUCKET/$S3_DESTINATION" --only-show-errors
          done
