name: iOS Release CI - Build

on:
  push:
    branches: [ stage ]
    paths:
      - 'react-native-notifyvisitors/nv_react_native_sdk_app/ios/**'
      - 'react-native-notifyvisitors/nv_react_native_sdk_app/pf_ios/**'
      - 'react-native-notifyvisitors/nv_react_native_sdk_app/src/**'
      - 'react-native-notifyvisitors/nv_react_native_sdk_app/package.json'
      - 'react-native-notifyvisitors/nv_react_native_sdk_app/package-lock.json'
      - '.github/workflows/ios.yml'

# All `run:` commands execute inside the app folder
defaults:
  run:
    working-directory: react-native-notifyvisitors/nv_react_native_sdk_app

jobs:
  build-ios:
    name: 🧱 Build iOS (Release)
    runs-on: macos-latest

    env:
      CI: true
      USE_HERMES: "1"
      RCT_NO_LAUNCH_PACKAGER: "true"
      NO_FLIPPER: "1"

      NV_BRAND_ID: ${{ vars.NV_BRAND_ID }}
      NV_BRAND_ENCRYPTION_KEY: ${{ vars.NV_BRAND_ENCRYPTION_KEY }}

      APP_SCHEME: nvRNSDKLiveAccountTestApp
      WORKSPACE: nvRNSDKLiveAccountTestApp.xcworkspace
      CONFIGURATION: app_store
      DEVELOPMENT_TEAM: 4JW4924F8P

      PROFILE_APP_NAME: nvRNLiveAcTestAppMainTargetReleaseDistribProfile
      PROFILE_EXT_NAME: nvRNLiveAcTestAppServicExtTargetReleaseDistProfile

      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:

      # -------------------------
      # 1️⃣ Checkout
      # -------------------------
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # 2️⃣ Generate Environment XCConfig
      # -------------------------
      - name: 🔧 Generate iOS Env File
        run: |
          echo "NV_BRAND_ID=${NV_BRAND_ID}" > ios/nvSecrets.xcconfig
          echo "NV_BRAND_ENCRYPTION_KEY=${NV_BRAND_ENCRYPTION_KEY}" >> ios/nvSecrets.xcconfig
          echo "Generated:"
          # cat ios/nvSecrets.xcconfig

      # -------------------------
      # 3️⃣ Node Setup
      # -------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cache JS Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 📥 Install JS Dependencies
        run: npm ci --legacy-peer-deps

      # -------------------------
      # 4️⃣ Install Pods + Fixes
      # -------------------------
      - name: 🧰 Prepare iOS Dependencies
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData ios/build ios/Pods

          cd ios
          pod install --repo-update

          # Fix permissions
          find Pods -type f -name "Script-*.sh" -exec chmod +x {} \;

          # Disable dependency analysis
          sed -i '' 's/"basedOnDependencyAnalysis" = YES;/"basedOnDependencyAnalysis" = NO;/g' \
            nvRNSDKLiveAccountTestApp.xcodeproj/project.pbxproj

      # -------------------------
      # 5️⃣ Auto-increment build number
      # -------------------------
      - name: 🔢 Increment Build Number
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          plutil -replace CFBundleVersion -string "$BUILD_NUMBER" ios/nvRNSDKLiveAccountTestApp/Info.plist

      # -------------------------
      # 6️⃣ Decrypt Signing Assets
      # -------------------------
      - name: 🔐 Decrypt Signing Files
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          mkdir -p ios/certs
          for FILE in appleDistribution.p12 main_Target_release.mobileprovision ext_Target_release.mobileprovision; do
            openssl aes-256-cbc -k "$CERT_PASSWORD" \
              -in "pf_ios/${FILE}.enc" -out "ios/certs/${FILE}" -d
          done

      # -------------------------
      # 7️⃣ Setup Keychain
      # -------------------------
      - name: 🔑 Setup Keychain
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          KEYCHAIN_NAME=build.keychain

          security create-keychain -p "$CERT_PASSWORD" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$CERT_PASSWORD" "$KEYCHAIN_NAME"

          security import ios/certs/appleDistribution.p12 -k "$KEYCHAIN_NAME" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERT_PASSWORD" "$KEYCHAIN_NAME"

      # -------------------------
      # 8️⃣ Install Provisioning Profiles
      # -------------------------
      - name: 📄 Install Provisioning Profiles
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/certs/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # -------------------------
      # 9️⃣ Bundle JS
      # -------------------------
      - name: 📦 Bundle JS
        run: |
          npx react-native bundle \
            --platform ios \
            --entry-file index.js \
            --dev false \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      # -------------------------
      # 🔟 Install xcpretty
      # -------------------------
      - name: 💎 Install xcpretty
        run: gem install xcpretty

      # -------------------------
      # 1️⃣1️⃣ Build & Archive App
      # -------------------------
      - name: 🏗️ Build & Archive iOS App (AdHoc)
        run: |
          cd ios
          mkdir -p build

          echo "🧹 Cleaning previous build..."
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$APP_SCHEME" -configuration "$CONFIGURATION"

          echo "📥 Copying ExportOptions.plist..."
          cp ../pf_ios/ExportOptions.plist ExportOptions.plist   # ✅ CORRECT PATH

          ARCHIVE_PATH="$PWD/build/${APP_SCHEME}.xcarchive"

          echo "📦 Archiving..."
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            archive | xcpretty

          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates | tee export.log

          ls -la build/export/

      # -------------------------
      # 1️⃣2️⃣ Upload to TestFlight
      # -------------------------
      - name: 🚀 Upload to TestFlight
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > AuthKey.p8

          KEY_CONTENT=$(awk '{printf "%s\\n", $0}' AuthKey.p8 | sed 's/"/\\"/g')

          cat > fastlane_api_key.json <<EOF
          {
            "key_id": "$APP_STORE_CONNECT_API_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key": "$KEY_CONTENT",
            "in_house": false
          }
EOF

          gem install fastlane -N

          fastlane deliver \
            --api_key_path fastlane_api_key.json \
            --ipa ios/build/export/*.ipa \
            --skip_screenshots \
            --skip_metadata \
            --run_precheck_before_submit false \
            --force

      # -------------------------
      # 1️⃣3️⃣ Upload IPA Artifact
      # -------------------------
      - name: ☁️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-adhoc-build
          path: ios/build/export/*.ipa
